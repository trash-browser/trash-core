[package]
name = "trashbrowser-gpui"
version = "0.1.0"
edition = "2024"
description = "Trash Browser — GPUI chrome + CEF content"

[[bin]]
name = "trashbrowser-gpui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cef = { version = "=150.0.0", default-features = false }
gpui = { path = "crates/gpui", default-features = false, features = ["font-kit"] }
gpui_platform = { path = "crates/gpui/crates/gpui_platform", default-features = false, features = ["font-kit"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
trash_adblock = { path = "crates/trash_adblock" }
trash_discord_rpc = { path = "crates/trash_discord_rpc" }
unicode-segmentation = "1"
sys-locale = "0.3"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui = { path = "crates/gpui", default-features = false, features = ["x11"] }
gpui_platform = { path = "crates/gpui/crates/gpui_platform", default-features = false, features = ["x11"] }
# Pin gpui_linux to X11 only. Its package default enables wayland, which
# (via feature unification) would make GPUI open a Wayland surface that CEF
# cannot parent a child window under.
gpui_linux = { path = "crates/gpui/crates/gpui_linux", default-features = false, features = ["x11"] }
x11-dl = "2"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Native COM folder picker (IFileOpenDialog) for downloads.chooseLocation. Runs
# on a dedicated STA thread so it never blocks or re-enters the CEF/GPUI loop.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"

[profile.dev]
debug = 1

# Shipping build: tuned for runtime performance over compile time. Without this
# section the release binary falls back to Cargo defaults (codegen-units = 16,
# no LTO), which leaves cross-crate inlining across gpui/cef/our own code on the
# table. This is the binary users actually run, so favor codegen quality.
[profile.release]
opt-level = 3
lto = "fat"           # cross-crate inlining across gpui / cef / trashbrowser
codegen-units = 1     # best codegen; trades parallel build time for speed
strip = "debuginfo"   # smaller binary, zero runtime cost
# panic stays "unwind" (default): CEF and our worker threads rely on unwinding.

# Optimize heavy dependencies even in dev builds so the debug browser stays
# usable. Our own crates keep full debug info / no opt for fast iteration.
[profile.dev.package."*"]
opt-level = 2
