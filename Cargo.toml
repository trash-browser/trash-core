[package]
name = "trashbrowser-gpui"
version = "0.1.0"
edition = "2024"
description = "Trash Browser — GPUI chrome + CEF content"

[[bin]]
name = "trashbrowser-gpui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cef = { version = "=150.0.0", default-features = false }
gpui = { path = "crates/gpui", default-features = false, features = ["font-kit"] }
gpui_platform = { path = "crates/gpui/crates/gpui_platform", features = ["font-kit"] }
raw-window-handle = "0.6"
unicode-segmentation = "1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui = { path = "crates/gpui", default-features = false, features = ["x11"] }
gpui_platform = { path = "crates/gpui/crates/gpui_platform", features = ["x11"] }
x11-dl = "2"

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"

[profile.dev]
debug = 1
