[package]
name = "trash_adblock"
version = "0.1.0"
edition = "2024"

[dependencies]
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
arc-swap = "1.7"
dashmap = "6.1"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.3"
url = "2.5"
