<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Start</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0f0f10;
    color: #e6e6e6;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px; height: 100vh;
  }
  .brand { text-align: center; line-height: 1.1; }
  .brand .l1 { font-size: 46px; font-weight: 800; letter-spacing: -1px; }
  .brand .l2 { font-size: 46px; font-weight: 800; letter-spacing: -1px; color: #34d399; }
  .sub { margin-top: 10px; color: #8a8a8f; font-size: 14px; }

  .tiles { display: flex; gap: 22px; margin-top: 40px; }
  .tile { text-decoration: none; color: inherit; text-align: center; }
  .tile .icon {
    width: 64px; height: 64px; border-radius: 16px;
    background: #1c1c1f; border: 1px solid #2a2a2e;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; color: #f2f2f2;
    transition: transform .12s ease, background .12s ease;
  }
  .tile:hover .icon { transform: translateY(-3px); background: #26262a; }
  .tile .label { margin-top: 8px; font-size: 12px; color: #9a9aa0; }
</style>
</head>
<body>
  <div class="brand">
    <div class="l1">Trash</div>
    <div class="l2">Browser</div>
  </div>
  <div class="sub">GPUI chrome · CEF content</div>

  <div class="tiles">
    <a class="tile" href="https://www.apple.com/">      <div class="icon">A</div><div class="label">Apple</div></a>
    <a class="tile" href="https://www.wikipedia.org/">  <div class="icon">W</div><div class="label">Wikipedia</div></a>
    <a class="tile" href="https://github.com/">         <div class="icon">G</div><div class="label">GitHub</div></a>
    <a class="tile" href="https://www.bing.com/">       <div class="icon">B</div><div class="label">Bing</div></a>
  </div>
</body>
</html>
